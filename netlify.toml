# Netlify configuration for Unity WebGL Gzip compressed builds

[build]
  publish = "."
  command = "cat \"Build/Gym Library Build.data.gz.part1\" \"Build/Gym Library Build.data.gz.part2\" > \"Build/Gym Library Build.data.gz\""

[[headers]]
  for = "/Build/*.data.gz"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Encoding = "gzip"

[[headers]]
  for = "/Build/*.wasm.gz"
  [headers.values]
    Content-Type = "application/wasm"
    Content-Encoding = "gzip"

[[headers]]
  for = "/Build/*.js.gz"
  [headers.values]
    Content-Type = "application/javascript"
    Content-Encoding = "gzip"

[[headers]]
  for = "/Build/*.symbols.json.gz"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Encoding = "gzip"
